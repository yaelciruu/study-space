<!DOCTYPE html>
<html>
<head>
    <title>study space.</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="mainlogo">study space.</div>
    
    <div class="login-container">
        
        <h2>build your own comfort,<br>
    <span class="aligntitleright">your own study space.</span> </h2>

        <form action="php/register.php" method="POST">
            
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>
            
            <label for="confirm_password">Confirm Password:</label>
            <input type="password" id="confirm_password" name="confirm_password" required>

            <button type="submit">Register</button>
        </form>

        <p>already have your space? : D  <a href="main.html">log-in here.</a></p>
    </div>
